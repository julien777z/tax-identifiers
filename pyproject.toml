[project]
name = "tax-identifiers"
version = "0.0.4"
description = "Validate tax identifiers and resolve their metadata with Pydantic"
authors = [
    { name = "Julien Kmec", email = "me@julien.dev" },
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-super-model>=2.0.0",
    "pycountry>=26.2.16",
]

[project.urls]
Repository = "https://github.com/julien777z/tax-identifiers"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "coverage>=7.15.0",
    "pyright>=1.1.407",
    "black>=25.9.0",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313", "py314"]

[tool.pyright]
include = ["tax_identifiers", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[[tool.pyright.executionEnvironments]]
root = "tests/unit"
reportArgumentType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
tests = "scripts.run_tests:main"

[tool.poetry]
packages = [
    {include = "tax_identifiers"},
    {include = "scripts"},
]
include = [
    { path = "tax_identifiers/py.typed", format = ["sdist", "wheel"] },
    { path = "tax_identifiers/us/static/*.pkl", format = ["sdist", "wheel"] },
    { path = "tax_identifiers/us/static/*.json", format = ["sdist"] },
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
